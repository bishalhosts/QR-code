<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scanner</title>
  <style>
    :root { --bg: #0f131b; --card: #181e2a; --line: #2a3243; --fg: #f2f4f8; --mut: #98a2b6; --ok: #1f9d55; --warn: #d98a00; --bad: #c93a3a; --accent: #4c8dff; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 22px; margin: 8px 0 0; }
    p.lead { margin: 0; color: var(--mut); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    label { display: block; color: var(--mut); font-size: 14px; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0f131b; color: var(--fg); font: inherit; }
    input::placeholder { color: #6b7488; }
    button { padding: 13px 18px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; background: var(--line); color: var(--fg); }
    button.primary { background: var(--accent); color: #fff; width: 100%; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #count { font-size: 18px; font-weight: 700; }
    .frame { position: relative; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); aspect-ratio: 1/1; max-height: 52vh; margin: 0 auto; width: 100%; min-height: 220px; }
    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #reader img { display: none; }
    #cam { margin: 0; color: var(--mut); font-size: 14px; text-align: center; min-height: 20px; }
    #cam.err { color: #ffb4b4; }
    #status { border-radius: 14px; padding: 22px 16px; text-align: center; background: var(--card); border: 1px solid var(--line); transition: background .15s; }
    #status.ok { background: var(--ok); border-color: var(--ok); }
    #status.already { background: var(--warn); border-color: var(--warn); }
    #status.invalid, #status.denied, #status.error { background: var(--bad); border-color: var(--bad); }
    #big { font-size: 34px; font-weight: 800; margin: 0; }
    #sub { font-size: 18px; margin: 6px 0 0; color: #e6e9f0; overflow-wrap: anywhere; }
    form { display: flex; gap: 8px; }
    form input { flex: 1; min-width: 0; }
    #retry { width: 100%; margin-top: 8px; }
    @media (min-width: 700px) {
      body { padding-top: 32px; }
      .frame { max-height: 420px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="setup" hidden>
      <h1>Connect the scanner</h1>
      <h3>Bishal Regmi</h3>
      <p class="lead">Enter these once. They are saved on this device.</p>
      <div class="card">
        <div class="field">
          <label for="url">Web app URL</label>
          <input id="url" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="field">
          <label for="key">Staff key</label>
          <input id="key" autocapitalize="off" autocomplete="off" placeholder="key">
        </div>
        <div class="field">
          <label for="by">Your name</label>
          <input id="by" autocomplete="off" placeholder="Enter Your Name">
        </div>
        <button class="primary" id="save">Start scanning</button>
      </div>
    </section>

    <section id="app" hidden>
      <div class="bar">
        <strong id="count">Loading…</strong>
        <button id="reset">Settings</button>
      </div>
      <div class="frame">
        <div id="reader"></div>
      </div>
      <p id="cam"></p>
      <button id="retry" hidden>Retry camera</button>
      <div id="status">
        <p id="big">Ready</p>
        <p id="sub">Point the camera at a ticket</p>
      </div>
      <form id="manual">
        <input id="code" placeholder="Or type the ticket code" autocomplete="off" autocapitalize="off">
        <button type="submit">Check</button>
      </form>
    </section>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    var cfg = {};
    try {
      cfg = JSON.parse(localStorage.getItem('cfg') || '{}');
    } catch (e) {}

    var $ = function (id) {
      return document.getElementById(id);
    };

    var busy = false, scanner = null;

    // ---------- BEEP (Web Audio API, no files needed) ----------
    var audioCtx = null;

    function unlockAudio() {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        g.gain.value = 0.0001;
        o.connect(g).connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + 0.01);
      } catch (e) {}
    }

    function beep(pattern) {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var t = audioCtx.currentTime;
        pattern.forEach(function (p) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = p.f;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + p.d);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + p.d + 0.01);
          t += p.d + (p.gap || 0);
        });
      } catch (e) {}
    }

    function soundFor(resultType) {
      if (resultType === 'ok') beep([{ f: 988, d: 0.12, gap: 0 }]);
      else if (resultType === 'already') beep([{ f: 880, d: 0.14, gap: 0.06 }, { f: 587, d: 0.18, gap: 0 }]);
      else if (resultType === 'invalid') beep([{ f: 300, d: 0.08, gap: 0.05 }, { f: 300, d: 0.08, gap: 0.05 }, { f: 300, d: 0.08, gap: 0 }]);
      else if (resultType === 'denied') beep([{ f: 220, d: 0.1, gap: 0.06 }, { f: 220, d: 0.1, gap: 0.06 }, { f: 220, d: 0.1, gap: 0 }]);
      else if (resultType === 'error') beep([{ f: 220, d: 0.12, gap: 0.08 }, { f: 220, d: 0.12, gap: 0 }]);
    }

    function vibrateFor(resultType) {
      if (!navigator.vibrate) return;
      if (resultType === 'ok') navigator.vibrate(80);
      else if (resultType === 'already') navigator.vibrate([150, 80, 150]);
      else if (resultType === 'invalid') navigator.vibrate([80, 60, 80, 60, 80]);
      else navigator.vibrate([120, 80, 120]);
    }

    function show() {
      var ready = cfg.url && cfg.key;
      $('setup').hidden = !!ready;
      $('app').hidden = !ready;
      if (ready) {
        // Wait one animation frame so #app/#reader have real size before the camera starts.
        requestAnimationFrame(function () {
          setTimeout(start, 50);
        });
      } else {
        $('url').value = cfg.url || '';
        $('key').value = cfg.key || '';
        $('by').value = cfg.by || '';
      }
    }

    $('save').onclick = function () {
      unlockAudio();
      cfg = {
        url: $('url').value.trim(),
        key: $('key').value.trim(),
        by: $('by').value.trim()
      };
      try {
        localStorage.setItem('cfg', JSON.stringify(cfg));
      } catch (e) {}
      show();
    };

    $('reset').onclick = function () {
      var keep = cfg;
      try {
        localStorage.setItem('cfg', JSON.stringify({ url: keep.url, by: keep.by }));
      } catch (e) {}
      location.reload();
    };

    function call(params) {
      var q = Object.keys(params).map(function (k) {
        return k + '=' + encodeURIComponent(params[k]);
      }).join('&');
      return fetch(cfg.url + '?key=' + encodeURIComponent(cfg.key) + '&' + q).then(function (r) {
        return r.json();
      });
    }

    // ---------- Instant scan: list kept in memory, saves go to the Sheet in the background ----------
    var list = null, total = 0, inCount = 0;
    var queue = [], sending = false, dirty = false, offline = false;
    var resetT = null, lastTok = '', lastAt = 0;

    function qkey() {
      return 'queue:' + (cfg.url || '');
    }

    function saveQueue() {
      try {
        localStorage.setItem(qkey(), JSON.stringify(queue));
      } catch (e) {}
    }

    function clock() {
      return new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Kathmandu' });
    }

    function showCount() {
      if (!list) return;
      var s = inCount + ' in · ' + (total - inCount) + ' to go';
      if (queue.length) s += offline ? ' · offline, ' + queue.length + ' waiting' : ' · saving ' + queue.length;
      $('count').textContent = s;
    }

    function applyList(rows) {
      var m = {}, n = 0;
      rows.forEach(function (r) {
        m[String(r[0]).toLowerCase()] = { n: r[1], d: r[2], o: r[3], t: r[4] };
        if (r[4]) n++;
      });
      queue.forEach(function (q) {
        var x = m[q.code.toLowerCase()];
        if (x && !x.t) {
          x.t = q.time || 'earlier';
          n++;
        }
      });
      list = m;
      total = rows.length;
      inCount = n;
      showCount();
    }

    function sync() {
      if (list && (queue.length || sending)) return;
      dirty = false;
      call({ action: 'list' }).then(function (r) {
        if (r.result === 'denied') {
          $('count').textContent = 'Wrong staff key';
          return;
        }
        if (r.result !== 'list') return;
        if (list && (dirty || queue.length)) return;
        applyList(r.rows);
      }).catch(function () {
        if (!list) $('count').textContent = 'Offline';
      });
    }

    function setStatus(cls, big, sub) {
      $('status').className = cls;
      $('big').textContent = big;
      $('sub').textContent = sub;
    }

    function result(r) {
      var who = [r.name, r.designation, r.organization].filter(Boolean).join(', ');
      var map = {
        ok: ['Welcome', who],
        already: ['Already used', (r.name || '') + ' came in at ' + (r.checkedInAt || '')],
        invalid: ['Not a valid ticket', 'Check the code and try again'],
        denied: ['Wrong staff key', 'Tap Settings and enter it again'],
        error: ['No connection', 'Check the internet and try again']
      };
      var m = map[r.result] || map.error;
      setStatus(map[r.result] ? r.result : 'error', m[0], m[1]);
      soundFor(r.result);
      vibrateFor(r.result);
      clearTimeout(resetT);
      resetT = setTimeout(function () {
        setStatus('', 'Ready', 'Point the camera at a ticket');
      }, 2500);
      setTimeout(function () {
        busy = false;
      }, 500);
    }

    function flush() {
      if (sending || !queue.length) return;
      sending = true;
      var q = queue[0];
      call({ action: 'scan', token: q.code, by: q.by }).then(function (r) {
        offline = false;
        if (r.result === 'denied') {
          sending = false;
          showCount();
          result(r);
          return;
        }
        queue.shift();
        saveQueue();
        dirty = true;
        if (r.result === 'already') {
          var p = list && list[q.code.toLowerCase()];
          if (p && r.checkedInAt) p.t = r.checkedInAt;
          result(r);
        } else if (r.result !== 'ok') {
          setStatus('error', 'Not saved', 'Ticket ' + q.code + ' was not found');
          soundFor('error');
          vibrateFor('error');
        }
        sending = false;
        showCount();
        flush();
      }).catch(function () {
        offline = true;
        sending = false;
        showCount();
        setTimeout(flush, 5000);
      });
    }

    function slowCheck(code) {
      setStatus('', 'Checking…', 'Please wait');
      call({ action: 'scan', token: code, by: cfg.by || '' }).then(function (r) {
        var p = list && list[code.toLowerCase()];
        if (r.result === 'ok' && p && !p.t) {
          p.t = clock();
          inCount++;
          showCount();
        }
        result(r);
      }).catch(function () {
        result({ result: 'error' });
      });
    }

    function check(raw) {
      var code = String(raw || '').split('|').pop().trim();
      var now = Date.now();
      if (busy || !code || (code === lastTok && now - lastAt < 4000)) return;
      lastTok = code;
      lastAt = now;
      busy = true;
      var p = list && list[code.toLowerCase()];
      if (!p) return slowCheck(code);
      if (p.t) {
        result({ result: 'already', name: p.n, checkedInAt: p.t });
        return;
      }
      p.t = clock();
      inCount++;
      dirty = true;
      result({ result: 'ok', name: p.n, designation: p.d, organization: p.o });
      queue.push({ code: code, by: cfg.by || '', time: p.t });
      saveQueue();
      showCount();
      flush();
    }

    // ---------- Camera start: real checks + clear errors + retry ----------
    function camFail(msg) {
      $('cam').textContent = msg;
      $('cam').classList.add('err');
      $('retry').hidden = false;
    }

    function start() {
      if (scanner) return;
      $('cam').classList.remove('err');
      $('cam').textContent = 'Starting camera…';
      $('retry').hidden = true;

      // 1) Must be HTTPS / localhost
      if (!window.isSecureContext) {
        camFail('Camera needs HTTPS. Open this page from an https:// address (not file:// and not http://).');
        return;
      }
      // 2) getUserMedia available
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camFail('This browser does not support the camera. Use Chrome on Android or Safari on iOS, over HTTPS.');
        return;
      }
      // 3) Library loaded
      if (typeof Html5Qrcode === 'undefined') {
        camFail('Scanner library did not load. Check the internet and reload the page.');
        return;
      }

      try {
        queue = JSON.parse(localStorage.getItem(qkey()) || '[]');
      } catch (e) {
        queue = [];
      }
      sync();
      flush();
      setInterval(sync, 30000);

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });

      var box = function (w, h) {
        var s = Math.floor(Math.min(w, h) * 0.7);
        return { width: s, height: s };
      };

      scanner.start(
        { facingMode: 'environment' },
        { fps: 15, qrbox: box, aspectRatio: 1, disableFlip: true },
        check,
        function () {}
      ).then(function () {
        $('cam').textContent = 'Point the camera at a ticket';
        $('cam').classList.remove('err');
        $('retry').hidden = true;
      }).catch(function (err) {
        var name = (err && err.name) || '';
        var msg = 'Camera failed to start.';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          msg = 'Camera permission was denied. Tap the lock icon in the address bar → Site settings → Camera → Allow, then tap Retry.';
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          msg = 'No camera found on this device.';
        } else if (name === 'NotReadableError' || name === 'TrackStartError') {
          msg = 'Camera is being used by another app. Close other camera apps and tap Retry.';
        } else if (name === 'OverconstrainedError') {
          msg = 'Camera does not support the requested mode. Tap Retry.';
        } else if (name === 'SecurityError') {
          msg = 'Camera blocked by the browser. Make sure the page is on HTTPS.';
        } else {
          msg = 'Camera failed: ' + (err && err.message ? err.message : name || 'unknown error') + '. Tap Retry.';
        }
        camFail(msg);
        scanner = null;
      });
    }

    $('retry').onclick = function () {
      if (scanner) {
        try { scanner.clear(); } catch (e) {}
        scanner = null;
      }
      start();
    };

    $('manual').onsubmit = function (e) {
      e.preventDefault();
      check($('code').value.trim());
      $('code').value = '';
    };

    show();
  </script>
</body>

</html>
